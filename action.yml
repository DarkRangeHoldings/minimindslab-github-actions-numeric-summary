name: "Numeric Summary"
description: "Summarize finite numeric values from JSON input with deterministic count, min, max, sum, mean, and median outputs."
inputs:
  payload:
    description: "JSON payload consumed by the action"
    required: true
outputs:
  result:
    description: "Compact JSON result produced by the action"
runs:
  using: "node24"
  main: "index.js"
branding:
  icon: "check-circle"
  color: "blue"
